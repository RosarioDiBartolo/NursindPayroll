services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./backend
    env_file: .env
    environment:
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env}
      DATABASE_URL: sqlite:////data/app.db
      OUTPUT_DIR: /data/payroll_documents
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}
    volumes:
      - payroll_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env}
      DATABASE_URL: sqlite:////data/app.db
      OUTPUT_DIR: /data/payroll_documents
      REDIS_URL: redis://redis:6379/0
    volumes:
      - payroll_data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  maintenance:
    build:
      context: ./backend
    command: ["python", "-m", "nursind.maintenance"]
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      OUTPUT_DIR: /data/payroll_documents
      REDIS_URL: redis://redis:6379/0
    volumes:
      - payroll_data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  payroll_data:
  redis_data:
